const ticketModal=document.getElementById('ticketModal'), ticketModalTitle=document.getElementById('ticketModalTitle'), ticketModalBody=document.getElementById('ticketModalBody'), ticketModalClose=document.getElementById('ticketModalClose');
const refreshData=document.getElementById('refreshData'), dataStatus=document.getElementById('dataStatus');
const grid=document.getElementById('releaseGrid'), ticketFilter=document.getElementById('ticketFilter'), productFilter=document.getElementById('productFilter'), statusFilter=document.getElementById('statusFilter'), visibleCount=document.getElementById('visibleCount'), ticketSummary=document.getElementById('ticketSummary'), noResults=document.getElementById('noResults');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addOptions(select, values){select.querySelectorAll('option:not([value=""])').forEach(o=>o.remove());[...new Set(values.filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)})}
addOptions(productFilter,releases.map(r=>r.product));addOptions(statusFilter,releases.map(r=>r.status));
function render(){const q=ticketFilter.value.trim().toLowerCase(), product=productFilter.value, status=statusFilter.value;const shown=releases.filter(r=>(!q||r.tickets.some(t=>t.toLowerCase().includes(q)))&&(!product||r.product===product)&&(!status||r.status===status));grid.innerHTML=shown.map(r=>{const ticketHtml=r.tickets.length?r.tickets.map(t=>`<button type="button" class="ticket-button" data-ticket="${esc(t)}">${esc(t)}</button>`).join('<span class="separator"> | </span>'):'<span class="empty">Nenhum ExternalTicketID encontrado na fonte para esta versão.</span>';return `<article class="release"><div class="release-head"><div><div class="version">${esc(r.version)}</div><div class="meta"><span class="pill">${esc(r.product||'Produto não informado')}</span><span class="pill ${r.status.toLowerCase()==='liberado'?'status-liberado':''}">${esc(r.status||'Status não informado')}</span><span class="pill">${esc(r.date||'Data não informada')}</span></div></div><div class="counter"><strong>${r.tickets.length}</strong><span>${r.tickets.length===1?'ticket':'tickets'}</span></div></div><div class="release-body"><div class="ticket-label">ExternalTicketIDs</div><div class="tickets">${ticketHtml}</div></div></article>`}).join('');visibleCount.textContent=shown.length;ticketSummary.textContent=`${shown.reduce((n,r)=>n+r.tickets.length,0)} tickets nas versões exibidas`;noResults.style.display=shown.length?'none':'block'}
[ticketFilter,productFilter,statusFilter].forEach(el=>el.addEventListener(el===ticketFilter?'input':'change',render));document.getElementById('clearFilters').addEventListener('click',()=>{ticketFilter.value='';productFilter.value='';statusFilter.value='';render();ticketFilter.focus()});
const detailLabels={'ID':'Work Item ID','Title 1':'Título 1','Title 2':'Título 2','Title 3':'Título 3','Title 4':'Título 4','Title 5':'Título 5','State':'Status','Priority':'Prioridade','ExternalTicketIDs':'Ticket externo','Effort':'Esforço','Story Points':'Story Points','Assigned To':'Responsável','Work Item Type':'Tipo de Work Item','Tags':'Tags','Area Path':'Área','Iteration Path':'Iteração','Parent':'Parent'};
function openTicket(ticket){const items=ticketDetails[ticket]||[];ticketModalTitle.textContent=`Ticket ${ticket}`;ticketModalBody.innerHTML=items.length?items.map((item,index)=>{const rows=Object.entries(item).filter(([,value])=>String(value).trim()).map(([key,value])=>`<div class="detail-label">${esc(detailLabels[key]||key)}</div><div class="detail-value">${esc(value)}</div>`).join('');return `<section class="work-item"><h3 class="work-item-title">${items.length>1?`Item ${index+1} de ${items.length}`:'Informações disponíveis'}</h3><div class="detail-grid">${rows}</div></section>`}).join(''):'<p class="modal-empty">Nenhuma informação adicional encontrada para este ticket.</p>';ticketModal.classList.add('open');document.body.style.overflow='hidden';ticketModalClose.focus()}
function closeTicket(){ticketModal.classList.remove('open');document.body.style.overflow=''}

const workbookShareUrl='https://cyncly.sharepoint.com/:x:/r/sites/PromobIntranet/criacaodeconteudo/Criao%20de%20Contedo/Arquivos%20Internos/Content%20Releases/LISTA.xlsx?d=w25ac4a28676d43f5a335dea0ae0cb2b3&csf=1&web=1&e=DCVANt';
function extractTicketIds(value){return [...String(value||'').matchAll(/\d+/g)].map(m=>m[0])}
function normalizedTags(value){return String(value||'').split(/[;,]/).map(v=>v.trim().toLowerCase()).filter(Boolean)}
function findHeader(row,names){const keys=Object.keys(row);return keys.find(k=>names.includes(String(k).trim().toLowerCase()))}
async function fetchWorkbook(){
  const candidates=[workbookShareUrl,workbookShareUrl.replace(/([?&])web=1(&|$)/,'$1download=1$2')];
  let lastError;
  for(const url of candidates){
    try{
      const response=await fetch(url,{credentials:'include',cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      const buffer=await response.arrayBuffer();
      if(buffer.byteLength<1000)throw new Error('Resposta recebida não parece ser uma planilha.');
      return buffer;
    }catch(error){lastError=error}
  }
  throw lastError||new Error('Não foi possível acessar a planilha.');
}
async function updateFromWorkbook(){
  refreshData.disabled=true;refreshData.textContent='Atualizando...';dataStatus.className='data-status';dataStatus.textContent='Lendo LISTA.xlsx...';
  try{
    if(typeof XLSX==='undefined')throw new Error('O leitor de Excel não foi carregado pelo navegador.');
    const buffer=await fetchWorkbook();
    const workbook=XLSX.read(buffer,{type:'array'});
    const sheet=workbook.Sheets[workbook.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
    if(!rows.length)throw new Error('A planilha não contém linhas de dados.');
    const sample=rows[0];
    const tagsKey=findHeader(sample,['tags']);
    const extKey=findHeader(sample,['externalticketids','external ticket ids','externalticketid']);
    if(!tagsKey||!extKey)throw new Error('As colunas Tags e ExternalTicketIDs não foram localizadas.');
    ticketDetails={};
    rows.forEach(row=>extractTicketIds(row[extKey]).forEach(id=>{if(!ticketDetails[id])ticketDetails[id]=[];ticketDetails[id].push(Object.fromEntries(Object.entries(row).filter(([,v])=>String(v).trim()))) }));
    releases=releases.map(release=>{
      const matched=rows.filter(row=>normalizedTags(row[tagsKey]).includes(release.version.trim().toLowerCase()));
      const tickets=[];const seen=new Set();
      matched.forEach(row=>extractTicketIds(row[extKey]).forEach(id=>{if(!seen.has(id)){seen.add(id);tickets.push(id)}}));
      return {...release,tickets,work_item_count:matched.length};
    });
    addOptions(productFilter,releases.map(r=>r.product));addOptions(statusFilter,releases.map(r=>r.status));render();
    const total=releases.reduce((n,r)=>n+r.tickets.length,0);
    dataStatus.className='data-status success';dataStatus.textContent=`Dados atualizados: ${rows.length} linhas lidas e ${total} tickets associados às versões.`;
  }catch(error){
    console.error('Falha ao atualizar LISTA.xlsx:',error);
    dataStatus.className='data-status error';dataStatus.textContent=`Não foi possível atualizar os dados: ${error.message}`;
  }finally{refreshData.disabled=false;refreshData.textContent='Atualizar Dados'}
}
refreshData.addEventListener('click',updateFromWorkbook);

render();
