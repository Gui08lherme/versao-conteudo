name: Localizar query do Azure DevOps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-query:
    runs-on: ubuntu-latest

    steps:
      - name: Localizar Wonder Squad - Epics
        shell: bash
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
          AZDO_ORGANIZATION: promob-dev
          AZDO_PROJECT: Promob

        run: |
          set -euo pipefail

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --output queries.json \
            --write-out "%{http_code}" \
            --user ":${AZDO_PAT}" \
            --header "Accept: application/json" \
            "https://dev.azure.com/${AZDO_ORGANIZATION}/${AZDO_PROJECT}/_apis/wit/queries?\$depth=2&\$expand=all&api-version=7.1")

          echo "Status HTTP recebido: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Falha ao listar as queries do Azure DevOps."

            python << 'PY'
          import json

          try:
              with open("queries.json", encoding="utf-8") as file:
                  result = json.load(file)

              print(result.get("message", "Resposta sem mensagem de erro."))
          except Exception:
              print("Não foi possível interpretar a resposta do Azure DevOps.")
          PY

            exit 1
          fi

          python << 'PY'
          import json

          TARGET = "wonder squad"

          with open("queries.json", encoding="utf-8") as file:
              result = json.load(file)

          matches = []

          def search(items, parent_path=""):
              for item in items or []:
                  name = str(item.get("name", "")).strip()
                  item_id = str(item.get("id", "")).strip()
                  item_path = str(item.get("path", "")).strip()

                  if not item_path:
                      item_path = (
                          f"{parent_path}/{name}"
                          if parent_path
                          else name
                      )

                  if TARGET in name.lower():
                      matches.append({
                          "name": name,
                          "id": item_id,
                          "path": item_path,
                          "isFolder": item.get("isFolder"),
                          "queryType": item.get("queryType"),
                      })

                  search(item.get("children", []), item_path)

          search(result.get("value", []))

          if not matches:
              print(
                  "Nenhuma query contendo 'Wonder Squad' "
                  "foi encontrada até a profundidade consultada."
              )
              raise SystemExit(1)

          print()
          print("Queries encontradas:")
          print()

          for match in matches:
              print(f"Nome: {match['name']}")
              print(f"ID: {match['id']}")
              print(f"Caminho: {match['path']}")
              print(f"É pasta: {match['isFolder']}")
              print(f"Tipo: {match['queryType']}")
              print("-" * 60)
          PY

      - name: Salvar resposta completa como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-devops-queries
          path: queries.json
          if-no-files-found: ignore
          retention-days: 3
