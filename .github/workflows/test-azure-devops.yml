name: Listar Queries Azure DevOps

on:
  workflow_dispatch:

jobs:
  list-queries:
    runs-on: ubuntu-latest

    steps:
      - name: Listar queries
        shell: bash
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}

        run: |
          curl \
            --silent \
            --show-error \
            --user ":${AZDO_PAT}" \
            --header "Accept: application/json" \
            "https://dev.azure.com/promob-dev/Promob/_apis/wit/queries?\$depth=2&api-version=7.1" \
            > queries.json

          python << 'PY'
          import json

          with open("queries.json", encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps(data, indent=2))
          PY
