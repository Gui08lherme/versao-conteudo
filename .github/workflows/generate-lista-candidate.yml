name: Gerar LISTA candidata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-excel:
    runs-on: ubuntu-latest

    env:
      AZDO_ORGANIZATION: promob-dev
      AZDO_PROJECT: Promob
      AZDO_QUERY_ID: 133e1671-7720-4c9b-ae84-e96eedeb96ee
      OUTPUT_FILE: LISTA-CANDIDATE.xlsx

    steps:
      - name: Baixar conteúdo do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Consultar Azure DevOps e gerar Excel
        shell: bash
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}

        run: |
          python <<'PY'
          import os
          import sys
          from collections import defaultdict
          from datetime import datetime, timezone

          import requests
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill
          from openpyxl.utils import get_column_letter


          ORGANIZATION = os.environ["AZDO_ORGANIZATION"]
          PROJECT = os.environ["AZDO_PROJECT"]
          QUERY_ID = os.environ["AZDO_QUERY_ID"]
          OUTPUT_FILE = os.environ["OUTPUT_FILE"]
          PAT = os.environ["AZDO_PAT"]

          BASE_URL = (
              f"https://dev.azure.com/"
              f"{ORGANIZATION}/{PROJECT}/_apis"
          )

          session = requests.Session()
          session.auth = ("", PAT)
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })


          def stop(message):
              print(f"ERRO: {message}")
              raise SystemExit(1)


          def check_response(response, operation):
              if response.ok:
                  return

              print(f"Falha em: {operation}")
              print(f"Status HTTP: {response.status_code}")

              try:
                  body = response.json()
                  print(body.get("message", body))
              except Exception:
                  print(response.text[:2000])

              response.raise_for_status()


          print("Executando a query Tree...")

          query_url = (
              f"{BASE_URL}/wit/wiql/{QUERY_ID}"
              f"?api-version=7.1"
          )

          query_response = session.get(query_url)
          check_response(
              query_response,
              "executar a query do Azure DevOps",
          )

          query_result = query_response.json()
          relations = query_result.get(
              "workItemRelations",
              [],
          )

          if not relations:
              stop(
                  "A query não retornou relações de árvore."
              )

          query_columns = query_result.get("columns", [])

          print(
              f"Relações retornadas pela query: "
              f"{len(relations)}"
          )


          # -------------------------------------------------------
          # Localizar os nomes internos dos campos pelas colunas
          # configuradas na própria query.
          # -------------------------------------------------------

          column_reference_by_name = {}

          for column in query_columns:
              display_name = str(
                  column.get("name", "")
              ).strip()

              reference_name = str(
                  column.get("referenceName", "")
              ).strip()

              if display_name and reference_name:
                  column_reference_by_name[
                      display_name.lower()
                  ] = reference_name


          def reference_for(display_names, fallback=None):
              for display_name in display_names:
                  reference = column_reference_by_name.get(
                      display_name.lower()
                  )

                  if reference:
                      return reference

              return fallback


          field_references = {
              "ID": "System.Id",
              "Title": "System.Title",
              "State": "System.State",
              "Priority": reference_for(
                  ["Priority"],
                  "Microsoft.VSTS.Common.Priority",
              ),
              "ExternalTicketIDs": reference_for(
                  [
                      "ExternalTicketIDs",
                      "External Ticket IDs",
                      "ExternalTicketID",
                      "External Ticket ID",
                  ]
              ),
              "Effort": reference_for(
                  ["Effort"],
                  "Microsoft.VSTS.Scheduling.Effort",
              ),
              "Story Points": reference_for(
                  ["Story Points"],
                  "Microsoft.VSTS.Scheduling.StoryPoints",
              ),
              "Assigned To": "System.AssignedTo",
              "Work Item Type": "System.WorkItemType",
              "Tags": "System.Tags",
              "Area Path": "System.AreaPath",
              "Iteration Path": "System.IterationPath",
          }

          if not field_references["ExternalTicketIDs"]:
              print(
                  "AVISO: o campo ExternalTicketIDs não foi "
                  "localizado nas colunas retornadas pela query."
              )
              print(
                  "O Excel será gerado com essa coluna vazia."
              )


          # -------------------------------------------------------
          # Reconstruir a árvore e preservar a ordem da query.
          # -------------------------------------------------------

          ordered_ids = []
          seen_ids = set()
          parent_by_id = {}
          children_by_id = defaultdict(list)

          for relation in relations:
              source = relation.get("source")
              target = relation.get("target")

              if not target or target.get("id") is None:
                  continue

              target_id = int(target["id"])

              if target_id not in seen_ids:
                  ordered_ids.append(target_id)
                  seen_ids.add(target_id)

              if source and source.get("id") is not None:
                  source_id = int(source["id"])
                  parent_by_id[target_id] = source_id
                  children_by_id[source_id].append(target_id)


          print(
              f"Work Items únicos localizados: "
              f"{len(ordered_ids)}"
          )

          if not ordered_ids:
              stop("Nenhum Work Item foi localizado.")


          # A API de lote aceita quantidades limitadas por chamada.
          def chunks(items, size):
              for start in range(0, len(items), size):
                  yield items[start:start + size]


          requested_fields = [
              reference
              for reference in field_references.values()
              if reference
          ]

          requested_fields = list(
              dict.fromkeys(requested_fields)
          )

          work_items_by_id = {}

          total_batches = (
              len(ordered_ids) + 199
          ) // 200

          for batch_number, batch_ids in enumerate(
              chunks(ordered_ids, 200),
              start=1,
          ):
              print(
                  f"Buscando lote {batch_number} "
                  f"de {total_batches}..."
              )

              batch_url = (
                  f"{BASE_URL}/wit/workitemsbatch"
                  f"?api-version=7.1"
              )

              payload = {
                  "ids": batch_ids,
                  "fields": requested_fields,
                  "errorPolicy": "Omit",
              }

              batch_response = session.post(
                  batch_url,
                  json=payload,
              )

              check_response(
                  batch_response,
                  f"buscar lote {batch_number}",
              )

              for item in batch_response.json().get(
                  "value",
                  [],
              ):
                  work_items_by_id[int(item["id"])] = item


          print(
              f"Work Items com dados recuperados: "
              f"{len(work_items_by_id)}"
          )

          if not work_items_by_id:
              stop(
          
