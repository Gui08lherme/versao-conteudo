name: Gerar LISTA candidata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-excel:
    runs-on: ubuntu-latest

    env:
      AZDO_ORGANIZATION: promob-dev
      AZDO_PROJECT: Promob
      AZDO_QUERY_ID: 133e1671-7720-4c9b-ae84-e96eedeb96ee
      OUTPUT_FILE: LISTA-CANDIDATE.xlsx

    steps:
      - name: Baixar conteúdo do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Consultar Azure DevOps e gerar Excel
        env:
          AZDO_PAT: ${{ secrets.AZDO_PAT }}
        run: python generate_lista.py

      - name: Validar existência do arquivo
        run: |
          test -f "${OUTPUT_FILE}"
          ls -lh "${OUTPUT_FILE}"

      - name: Publicar Excel como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lista-candidate
          path: LISTA-CANDIDATE.xlsx
          if-no-files-found: error
          retention-days: 7
